<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Seguro — ZEVOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --black:      #0d0d0d;
            --white:      #fafaf8;
            --gray-light: #e8e8e5;
            --gray-mid:   #888884;
            --gray-sub:   #f4f4f2;
            --gold:       #B8860B;
            --green:      #1a6b3a;
            --red:        #c0392b;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans:  'Montserrat', system-ui, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background: var(--white);
            color: var(--black);
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .nav {
            background: var(--black);
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav__logo {
            font-family: var(--font-serif);
            color: var(--white);
            font-size: 1.15rem;
            letter-spacing: 0.18em;
            text-decoration: none;
        }
        .nav__secure {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
        }
        .nav__secure svg { opacity: 0.55; }

        /* ── LAYOUT ── */
        .checkout {
            max-width: 960px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        @media (min-width: 720px) {
            .checkout { grid-template-columns: 1fr 380px; gap: 3rem; }
        }

        /* ── SECCIÓN ── */
        .section-title {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            margin-bottom: 1.5rem;
        }

        /* ── RESUMEN DE ORDEN ── */
        .order-summary {
            background: var(--gray-sub);
            border: 1px solid var(--gray-light);
            border-radius: 4px;
            padding: 1.5rem;
        }
        .order-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.85rem 0;
            border-bottom: 1px solid var(--gray-light);
        }
        .order-item:last-of-type { border-bottom: none; }
        .order-item__img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            background: var(--white);
            border: 1px solid var(--gray-light);
            border-radius: 3px;
            padding: 4px;
            flex-shrink: 0;
        }
        .order-item__img--placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-mid);
            font-size: 1.2rem;
        }
        .order-item__info { flex: 1; min-width: 0; }
        .order-item__name {
            font-family: var(--font-serif);
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .order-item__meta {
            font-size: 0.62rem;
            color: var(--gray-mid);
            letter-spacing: 0.06em;
            margin-top: 0.2rem;
        }
        .order-item__price {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .order-totals {
            padding-top: 1rem;
            margin-top: 0.5rem;
            border-top: 1px solid var(--gray-light);
        }
        .order-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            color: var(--gray-mid);
        }
        .order-total-row--main {
            color: var(--black);
            font-size: 1.05rem;
            font-family: var(--font-serif);
            margin-top: 0.35rem;
            padding-top: 0.55rem;
            border-top: 1px solid var(--gray-light);
        }

        /* ── FORMULARIO ── */
        .form-group { margin-bottom: 1.2rem; }
        .form-label {
            display: block;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gray-mid);
            margin-bottom: 0.45rem;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-light);
            border-radius: 3px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            background: var(--white);
            color: var(--black);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--black); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        /* ── BOTÓN PAGO ── */
        .pay-btn {
            width: 100%;
            padding: 1rem;
            background: var(--black);
            color: var(--white);
            border: none;
            border-radius: 3px;
            font-family: var(--font-sans);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: background 0.2s, opacity 0.2s;
            min-height: 52px;
        }
        .pay-btn:hover { background: #222; }
        .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── SPINNER ── */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pay-btn.loading .spinner { display: block; }
        .pay-btn.loading .btn-text { display: none; }

        /* ── SEGURIDAD ── */
        .security-badges {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1rem 0 0;
            flex-wrap: wrap;
        }
        .badge {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.58rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gray-mid);
        }
        .badge svg { flex-shrink: 0; }

        /* ── ERROR ── */
        .error-msg {
            background: #fdf0ef;
            border: 1px solid #f0c0bb;
            border-radius: 3px;
            padding: 0.75rem 1rem;
            font-size: 0.78rem;
            color: var(--red);
            margin-top: 0.75rem;
            display: none;
        }
        .error-msg.visible { display: block; }

        /* ── CARRITO VACÍO ── */
        .empty-cart {
            text-align: center;
            padding: 4rem 1.25rem;
            grid-column: 1 / -1;
        }
        .empty-cart p { color: var(--gray-mid); font-size: 0.85rem; margin: 1rem 0 2rem; }

        /* ── MP LOGO ── */
        .mp-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.2rem;
            font-size: 0.6rem;
            color: var(--gray-mid);
            letter-spacing: 0.08em;
        }
        .mp-logo img { height: 18px; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="index.html" class="nav__logo">ZEVOR</a>
    <div class="nav__secure">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Pago 100% Seguro
    </div>
</nav>

<main class="checkout" id="checkoutMain">
    <!-- Se renderiza por JS -->
</main>

<script>
/* ── Configuración ── */
const SERVER_URL = 'http://localhost:3001'; /* Cambiar en producción */
const IS_SANDBOX = true;                    /* true = modo prueba, false = producción */

/* ── Cargar carrito desde localStorage ── */
const cart = JSON.parse(localStorage.getItem('zevorCart') || '[]');
const main = document.getElementById('checkoutMain');

function fmt(n) { return '$' + Number(n).toLocaleString('es-AR'); }

/* ── Carrito vacío ── */
if (!cart.length) {
    main.innerHTML = `
        <div class="empty-cart">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.2">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <p>Tu carrito está vacío.</p>
            <a href="catalogo.html" style="font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#0d0d0d;">
                → Volver al catálogo
            </a>
        </div>`;
} else {

/* ── Calcular totales ── */
const subtotal  = cart.reduce((s, i) => s + (i.price || 0) * (i.qty || 1), 0);
const itemsHTML = cart.map(item => {
    const img = item.imagen
        ? `<img src="${item.imagen}" alt="${item.name}" class="order-item__img">`
        : `<div class="order-item__img order-item__img--placeholder">👓</div>`;
    const meta = [item.marco, item.lentes, item.talla].filter(Boolean).join(' · ');
    return `
        <div class="order-item">
            ${img}
            <div class="order-item__info">
                <div class="order-item__name">${item.name}</div>
                ${meta ? `<div class="order-item__meta">${meta}</div>` : ''}
                <div class="order-item__meta">Cantidad: ${item.qty || 1}</div>
            </div>
            <div class="order-item__price">${fmt((item.price || 0) * (item.qty || 1))}</div>
        </div>`;
}).join('');

main.innerHTML = `
    <!-- Columna izquierda: Datos del comprador -->
    <div>
        <h1 class="section-title">Datos de contacto</h1>

        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="buyerEmail"
                   placeholder="tu@email.com" autocomplete="email" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-input" id="buyerName"
                       placeholder="Juan" autocomplete="given-name">
            </div>
            <div class="form-group">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-input" id="buyerLast"
                       placeholder="García" autocomplete="family-name">
            </div>
        </div>

        <div style="height:1.5rem"></div>
        <h2 class="section-title" style="font-size:1.1rem">Envío</h2>

        <div class="form-group">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-input" id="shipAddress"
                   placeholder="Av. Corrientes 1234" autocomplete="street-address">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Ciudad</label>
                <input type="text" class="form-input" id="shipCity" placeholder="Buenos Aires">
            </div>
            <div class="form-group">
                <label class="form-label">Código Postal</label>
                <input type="text" class="form-input" id="shipCP" placeholder="C1043">
            </div>
        </div>
    </div>

    <!-- Columna derecha: Resumen + Pago -->
    <div>
        <h2 class="section-title">Tu pedido</h2>

        <div class="order-summary">
            ${itemsHTML}
            <div class="order-totals">
                <div class="order-total-row">
                    <span>Subtotal</span>
                    <span>${fmt(subtotal)}</span>
                </div>
                <div class="order-total-row">
                    <span>Envío</span>
                    <span style="color:#1a6b3a;font-weight:600">A coordinar</span>
                </div>
                <div class="order-total-row order-total-row--main">
                    <span>Total</span>
                    <span>${fmt(subtotal)}</span>
                </div>
            </div>
        </div>

        <button class="pay-btn" id="payBtn" onclick="iniciarPago()">
            <span class="btn-text">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px">
                    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Continuar al Pago
            </span>
            <span class="spinner"></span>
        </button>

        <div class="error-msg" id="errorMsg"></div>

        <div class="security-badges">
            <span class="badge">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                SSL Seguro
            </span>
            <span class="badge">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Datos cifrados
            </span>
            <span class="badge">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                Pago verificado
            </span>
        </div>

        <div class="mp-logo">
            <span>Procesado por</span>
            <strong style="font-size:0.72rem;color:#009EE3;letter-spacing:0.04em">Mercado Pago</strong>
        </div>
    </div>`;
}

async function iniciarPago() {
    const email = document.getElementById('buyerEmail')?.value?.trim();
    if (!email || !email.includes('@')) {
        mostrarError('Por favor ingresá un email válido.');
        return;
    }

    const btn = document.getElementById('payBtn');
    btn.classList.add('loading');
    btn.disabled = true;
    ocultarError();

    /* Mapear el carrito al formato que espera el servidor */
    const items = cart.map(item => ({
        productId: item.id,   /* id numérico del producto */
        qty:       item.qty || 1,
    }));

    try {
        const res = await fetch(`${SERVER_URL}/api/create-preference`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ items, buyerEmail: email }),
        });

        const data = await res.json();

        if (!res.ok) {
            mostrarError(data.error || 'Error al iniciar el pago.');
            btn.classList.remove('loading');
            btn.disabled = false;
            return;
        }

        /* Redirigir al checkout de Mercado Pago */
        window.location.href = IS_SANDBOX ? data.sandbox : data.initPoint;

    } catch (e) {
        mostrarError('No se pudo conectar con el servidor de pagos. Verificá tu conexión.');
        btn.classList.remove('loading');
        btn.disabled = false;
    }
}

function mostrarError(msg) {
    const el = document.getElementById('errorMsg');
    if (el) { el.textContent = msg; el.classList.add('visible'); }
}
function ocultarError() {
    const el = document.getElementById('errorMsg');
    if (el) el.classList.remove('visible');
}
</script>
</body>
</html>
